<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Dev console for Claude Code and Codex tmux sessions: live terminal, projects, events, and an AI operator." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Devy" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" />
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Devy</title>
  </head>
  <body data-route="sessions">
    <div class="app">
      <aside class="rail" id="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Devy</span>
          <span class="brand-host" id="brand-host">…</span>
        </div>
        <nav class="rail-nav" aria-label="Pages">
          <a href="#sessions" data-route="sessions" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span class="nav-label">Sessions</span><span class="nav-badge" data-badge="sessions"></span></a>
          <a href="#terminal" data-route="terminal" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg></span><span class="nav-label">Terminal</span></a>
          <a href="#ai" data-route="ai" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></svg></span><span class="nav-label">AI</span><span class="nav-badge" data-badge="ai-on">off</span></a>
          <a href="#events" data-route="events" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span class="nav-label">Events</span><span class="nav-badge" data-badge="events"></span></a>
          <a href="#projects" data-route="projects" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></span><span class="nav-label">Projects</span><span class="nav-badge" data-badge="projects"></span></a>
          <a href="#gateway" data-route="gateway" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg></span><span class="nav-label">Gateway</span></a>
          <a href="#settings" data-route="settings" class="nav-item"><span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg></span><span class="nav-label">Settings</span></a>
        </nav>
        <div class="rail-foot">
          <a class="remote-link" href="/remote/">Open quick remote <span aria-hidden="true">↗</span></a>
          <div class="vitals" id="stat-grid" aria-label="Server vitals">
            <div class="vital"><span>load</span><b id="stat-cpu">—</b></div>
            <div class="vital"><span>mem</span><b id="stat-mem">—</b></div>
            <div class="vital"><span>disk</span><b id="stat-disk">—</b></div>
            <div class="vital"><span>up</span><b id="stat-up">—</b></div>
          </div>
          <div class="health" id="health-row">
            <span class="dot" id="health-dot" aria-hidden="true"></span>
            <span id="health-text">connecting…</span>
          </div>
        </div>
      </aside>

      <button class="scrim" id="nav-scrim" aria-label="Close navigation" tabindex="-1"></button>

      <main class="main">
        <header class="bar">
          <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
          <div class="bar-title">
            <h1 id="crumb-page">Sessions</h1>
            <span class="bar-context" id="crumb-context"></span>
          </div>
          <div class="bar-actions">
            <span class="bar-health" id="bar-health" aria-hidden="true"></span>
            <button class="kbd-hint" id="palette-open" aria-label="Open command palette" title="Command palette (⌘K)">⌘K</button>
            <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">↻</button>
          </div>
        </header>

        <section class="page" id="page-root"></section>
      </main>

      <nav class="tabs" aria-label="Primary">
        <a href="#sessions" data-route="sessions"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span>Sessions</span><span class="tab-badge" data-badge="sessions-tab"></span></a>
        <a href="#terminal" data-route="terminal"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg></span><span>Terminal</span></a>
        <a href="#ai" data-route="ai"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></svg></span><span>AI</span></a>
        <a href="#events" data-route="events"><span class="tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span>Events</span><span class="tab-badge" data-badge="events-tab"></span></a>
        <button type="button" id="more-tab" aria-haspopup="dialog"><span class="tab-ic" aria-hidden="true">···</span><span>More</span></button>
      </nav>
    </div>

    <div class="overlay" id="palette" hidden>
      <div class="sheet palette-card" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="palette-input" placeholder="Jump to a session, project or page" autocomplete="off" aria-label="Search sessions, projects and pages" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" />
        <ul id="palette-list" role="listbox"></ul>
        <div class="palette-foot">↑↓ move &nbsp; ↵ open &nbsp; esc close</div>
      </div>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="/vendor/xterm/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit/addon-fit.js"></script>
    <script src="/vendor/xterm-addon-web-links/addon-web-links.js"></script>
    <script src="/vendor/xterm-addon-search/addon-search.js"></script>
    <script src="/vendor/xterm-addon-unicode11/addon-unicode11.js"></script>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/gateway.js"></script>
  </body>
</html>
